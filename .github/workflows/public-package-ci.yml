name: Reusable public package CI

on:
  workflow_call:
    inputs:
      install-browser:
        description: Install the package's pinned browser before running CI.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  required:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.23.1
          - 24.18.0
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser test runtime
        if: inputs.install-browser
        run: pnpm run browser:install
      - name: Run release-grade package checks
        run: pnpm run ci

  informational-node-26:
    name: Node 26 informational
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.5.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser test runtime
        if: inputs.install-browser
        run: pnpm run browser:install
      - name: Run package checks
        run: pnpm run ci

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
      - name: Install hash-locked YAML parser
        shell: bash
        run: |
          set -euo pipefail
          requirements="${RUNNER_TEMP}/workflow-policy-requirements.txt"
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' \
            > "${requirements}"
          python3 -I -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "${requirements}"
      - name: Validate workflow syntax and pinned actions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' workflows < <(
            find .github/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) -print0 | sort -z
          )
          test "${#workflows[@]}" -gt 0
          "${RUNNER_TEMP}/actionlint" "${workflows[@]}"
          shadow_directory="${RUNNER_TEMP}/workflow-policy-shadow"
          mkdir -p "${shadow_directory}"
          printf '%s\n' 'raise RuntimeError("checkout-local yaml.py was imported")' \
            > "${shadow_directory}/yaml.py"
          (
            cd "${shadow_directory}"
            python3 -I - <<'PYTHON'
          from pathlib import Path

          import yaml

          if Path(yaml.__file__).resolve().parent == Path.cwd():
              raise RuntimeError("isolated Python imported checkout-local yaml.py")
          if not callable(getattr(yaml, "safe_load", None)):
              raise RuntimeError("isolated Python did not import the installed PyYAML package")
          PYTHON
          )
          python3 -I - <<'PYTHON'
          from pathlib import Path
          import re

          import yaml

          github_action = re.compile(
              r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*@[0-9a-f]{40}$"
          )
          docker_action = re.compile(r"^docker://[^@\s]+@sha256:[0-9a-f]{64}$")

          def validate_reference(reference: object, name: str) -> None:
              if not isinstance(reference, str):
                  raise ValueError(f"{name} contains a non-string action reference")
              if reference.startswith("./"):
                  return
              if reference.startswith("docker://"):
                  if docker_action.fullmatch(reference):
                      return
                  raise ValueError(
                      f"{name} contains a Docker action that is not pinned by SHA-256 digest: {reference}"
                  )
              if github_action.fullmatch(reference):
                  return
              raise ValueError(
                  f"{name} contains an invalid or non-SHA-pinned action reference: {reference}"
              )

          def visit(value: object, name: str) -> None:
              if isinstance(value, dict):
                  for key, nested in value.items():
                      if key == "uses":
                          validate_reference(nested, name)
                      visit(nested, name)
              elif isinstance(value, list):
                  for nested in value:
                      visit(nested, name)

          for bypass in (
              "- uses : actions/checkout@v4",
              '- "uses": actions/checkout@v4',
              "- { uses: actions/checkout@v4 }",
              r'- "u\u0073es": actions/checkout@v4',
          ):
              try:
                  visit(yaml.safe_load(f"steps:\n  {bypass}\n"), "policy-self-test.yml")
              except ValueError:
                  pass
              else:
                  raise ValueError(f"Workflow policy accepted bypass: {bypass}")

          for reference in (
              "./.github/actions/local",
              f"actions/checkout@{'a' * 40}",
              f"docker://alpine@sha256:{'b' * 64}",
          ):
              validate_reference(reference, "policy-self-test.yml")

          workflow_directory = Path(".github/workflows")
          for workflow in sorted(workflow_directory.iterdir()):
              if workflow.suffix not in {".yml", ".yaml"}:
                  continue
              try:
                  document = yaml.safe_load(workflow.read_text(encoding="utf-8"))
              except yaml.YAMLError as error:
                  raise ValueError(f"{workflow.name} could not be parsed structurally") from error
              visit(document, workflow.name)
          PYTHON
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const workflowDirectory = path.join('.github', 'workflows');
          const candidate = fs.readFileSync(
            path.join(workflowDirectory, 'candidate.yml'),
            'utf8',
          );
          const required = [
            'tags:',
            'v*',
            'artifact-metadata: write',
            'fetch-depth: 0',
            'git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main',
            'test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"',
            "          printf 'checksums=%s\\n' \"${checksums[0]}\" >> \"${GITHUB_OUTPUT}\"",
            'subject-checksums: ${ { steps.subject.outputs.checksums } }'.replaceAll(' ', ''),
            'gh attestation verify',
            '--digest-alg sha512',
            '--signer-workflow',
            '--signer-digest "${GITHUB_SHA}"',
            '--source-digest "${GITHUB_SHA}"',
            '--source-ref "${GITHUB_REF}"',
            '--deny-self-hosted-runners',
          ];
          const compactCandidate = candidate.replaceAll(' ', '');
          for (const marker of required) {
            const haystack = marker.includes('subject-checksums:')
              ? compactCandidate
              : candidate;
            if (!haystack.includes(marker)) {
              throw new Error(`candidate.yml is missing release policy marker: ${marker}`);
            }
          }
          NODE

  reuse:
    name: REUSE 3.3 compliance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned REUSE tool
        run: python3 -I -m pip install --disable-pip-version-check 'reuse[charset-normalizer]==6.2.0'
      - name: Validate licensing metadata
        run: reuse lint

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Verify Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/commits" \
            > "${RUNNER_TEMP}/commits.json"
          node - "${RUNNER_TEMP}/commits.json" <<'NODE'
          const fs = require('node:fs');

          const pages = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const commits = pages.flat();
          if (commits.length === 0) throw new Error('Pull request has no commits.');
          const normalizeName = (value) => value.trim().replace(/\s+/g, ' ');
          for (const entry of commits) {
            const identities = [entry.commit.author, entry.commit.committer]
              .filter(Boolean)
              .map(({ name, email }) => ({
                name: normalizeName(name),
                email: email.trim().toLowerCase(),
              }));
            const trailers = [...entry.commit.message.matchAll(
              /^Signed-off-by:\s*([^<\n]+?)\s*<([^>\n]+)>\s*$/gim,
            )].map((match) => ({
              name: normalizeName(match[1]),
              email: match[2].trim().toLowerCase(),
            }));
            const valid = trailers.some((trailer) =>
              identities.some(
                (identity) =>
                  identity.name === trailer.name &&
                  identity.email === trailer.email,
              ),
            );
            if (!valid) {
              throw new Error(
                `Commit ${entry.sha.slice(0, 12)} lacks an author- or committer-matching Signed-off-by trailer.`,
              );
            }
          }
          NODE
