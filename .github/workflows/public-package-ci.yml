name: Reusable public package CI

on:
  workflow_call:
    inputs:
      install-browser:
        description: Install the package's pinned browser before running CI.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  required:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.23.1
          - 24.18.0
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser test runtime
        if: inputs.install-browser
        run: pnpm run browser:install
      - name: Run release-grade package checks
        run: pnpm run ci

  informational-node-26:
    name: Node 26 informational
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.5.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser test runtime
        if: inputs.install-browser
        run: pnpm run browser:install
      - name: Run package checks
        run: pnpm run ci

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
      - name: Install hash-locked YAML parser
        shell: bash
        run: |
          set -euo pipefail
          requirements="${RUNNER_TEMP}/workflow-policy-requirements.txt"
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' \
            > "${requirements}"
          python3 -I -m venv "${RUNNER_TEMP}/workflow-policy-venv"
          "${RUNNER_TEMP}/workflow-policy-venv/bin/python" -I -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "${requirements}"
      - name: Validate workflow syntax and pinned actions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' workflows < <(
            find .github/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) -print0 | sort -z
          )
          test "${#workflows[@]}" -gt 0
          "${RUNNER_TEMP}/actionlint" "${workflows[@]}"
          policy_python="${RUNNER_TEMP}/workflow-policy-venv/bin/python"
          shadow_directory="${RUNNER_TEMP}/workflow-policy-shadow"
          mkdir -p "${shadow_directory}"
          printf '%s\n' 'raise RuntimeError("checkout-local yaml.py was imported")' \
            > "${shadow_directory}/yaml.py"
          (
            cd "${shadow_directory}"
            "${policy_python}" -I - <<'PYTHON'
          from pathlib import Path

          import yaml

          if Path(yaml.__file__).resolve().parent == Path.cwd():
              raise RuntimeError("isolated Python imported checkout-local yaml.py")
          if not callable(getattr(yaml, "safe_load", None)):
              raise RuntimeError("isolated Python did not import the installed PyYAML package")
          PYTHON
          )
          "${policy_python}" -I - <<'PYTHON'
          import os
          import re
          import shutil
          from pathlib import Path

          import yaml

          github_reference = re.compile(
              r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*@[0-9a-f]{40}$"
          )
          docker_action = re.compile(r"^docker://[^@\s]+@sha256:[0-9a-f]{64}$")

          class PolicyScanner:
              def __init__(self, repository_root: Path) -> None:
                  self.repository_root = repository_root.resolve()
                  self.visited: set[tuple[str, Path]] = set()

              def display_name(self, path: Path) -> str:
                  try:
                      return path.relative_to(self.repository_root).as_posix()
                  except ValueError:
                      return path.as_posix()

              def load_document(self, path: Path) -> object:
                  try:
                      return yaml.safe_load(path.read_text(encoding="utf-8"))
                  except (OSError, UnicodeError, yaml.YAMLError) as error:
                      raise ValueError(
                          f"{self.display_name(path)} could not be parsed structurally"
                      ) from error

              def resolve_local(self, reference: str, source: Path) -> Path:
                  candidate = (self.repository_root / reference[2:]).resolve()
                  try:
                      candidate.relative_to(self.repository_root)
                  except ValueError as error:
                      raise ValueError(
                          f"{self.display_name(source)} contains an escaping local reference: {reference}"
                      ) from error
                  if not candidate.exists():
                      raise ValueError(
                          f"{self.display_name(source)} contains a missing local reference: {reference}"
                      )
                  return candidate

              def validate_external(self, reference: object, source: Path) -> str:
                  if not isinstance(reference, str):
                      raise ValueError(
                          f"{self.display_name(source)} contains a non-string action reference"
                      )
                  if reference.startswith("docker://"):
                      if docker_action.fullmatch(reference):
                          return reference
                      raise ValueError(
                          f"{self.display_name(source)} contains a Docker action that is not pinned by SHA-256 digest: {reference}"
                      )
                  if github_reference.fullmatch(reference):
                      return reference
                  raise ValueError(
                      f"{self.display_name(source)} contains an invalid or non-SHA-pinned action reference: {reference}"
                  )

              def scan_reference(
                  self,
                  reference: object,
                  source: Path,
                  reference_kind: str,
              ) -> None:
                  if not isinstance(reference, str) or not reference.startswith("./"):
                      self.validate_external(reference, source)
                      return

                  local_path = self.resolve_local(reference, source)
                  if reference_kind == "workflow":
                      if (
                          not local_path.is_file()
                          or local_path.suffix not in {".yml", ".yaml"}
                          or local_path.parent
                          != self.repository_root / ".github" / "workflows"
                      ):
                          raise ValueError(
                              f"{self.display_name(source)} contains an invalid local reusable workflow: {reference}"
                          )
                      self.scan_workflow(local_path)
                      return

                  if not local_path.is_dir():
                      raise ValueError(
                          f"{self.display_name(source)} contains a local action that is not a directory: {reference}"
                      )
                  metadata = [
                      candidate
                      for candidate in (
                          local_path / "action.yml",
                          local_path / "action.yaml",
                      )
                      if candidate.is_file()
                  ]
                  if len(metadata) != 1:
                      raise ValueError(
                          f"{self.display_name(source)} local action must contain exactly one action.yml or action.yaml: {reference}"
                      )
                  self.scan_action(metadata[0])

              def scan_workflow_document(self, document: object, source: Path) -> None:
                  if not isinstance(document, dict):
                      raise ValueError(
                          f"{self.display_name(source)} must contain a workflow mapping"
                      )
                  jobs = document.get("jobs", {})
                  if not isinstance(jobs, dict):
                      raise ValueError(
                          f"{self.display_name(source)} jobs must be a mapping"
                      )
                  for job in jobs.values():
                      if not isinstance(job, dict):
                          continue
                      if "uses" in job:
                          self.scan_reference(job["uses"], source, "workflow")
                      steps = job.get("steps", [])
                      if not isinstance(steps, list):
                          continue
                      for step in steps:
                          if isinstance(step, dict) and "uses" in step:
                              self.scan_reference(step["uses"], source, "action")

              def scan_workflow(self, path: Path) -> None:
                  resolved = path.resolve()
                  try:
                      resolved.relative_to(self.repository_root)
                  except ValueError as error:
                      raise ValueError(
                          f"Workflow metadata escapes the repository: {path.as_posix()}"
                      ) from error
                  key = ("workflow", resolved)
                  if key in self.visited:
                      return
                  self.visited.add(key)
                  self.scan_workflow_document(self.load_document(resolved), resolved)

              def scan_action(self, path: Path) -> None:
                  resolved = path.resolve()
                  try:
                      resolved.relative_to(self.repository_root)
                  except ValueError as error:
                      raise ValueError(
                          f"Action metadata escapes the repository: {path.as_posix()}"
                      ) from error
                  key = ("action", resolved)
                  if key in self.visited:
                      return
                  self.visited.add(key)
                  document = self.load_document(resolved)
                  if not isinstance(document, dict):
                      raise ValueError(
                          f"{self.display_name(resolved)} must contain an action mapping"
                      )
                  runs = document.get("runs", {})
                  if not isinstance(runs, dict):
                      return
                  raw_using = runs.get("using")
                  if not isinstance(raw_using, str):
                      raise ValueError(
                          f"{self.display_name(resolved)} contains a non-string runs.using value"
                      )
                  using = raw_using.casefold()
                  if using == "docker":
                      image = runs.get("image")
                      if not isinstance(image, str):
                          raise ValueError(
                              f"{self.display_name(resolved)} contains a non-string Docker image"
                          )
                      if image.casefold().startswith("docker://"):
                          normalized_image = f"docker://{image[len('docker://'):]}"
                          self.validate_external(normalized_image, resolved)
                          return
                      dockerfile = (resolved.parent / image).resolve()
                      try:
                          dockerfile.relative_to(self.repository_root)
                      except ValueError as error:
                          raise ValueError(
                              f"{self.display_name(resolved)} contains an escaping Dockerfile path: {image}"
                          ) from error
                      if not dockerfile.is_file():
                          raise ValueError(
                              f"{self.display_name(resolved)} contains a missing Dockerfile path: {image}"
                          )
                      return
                  if using != "composite":
                      return
                  steps = runs.get("steps", [])
                  if not isinstance(steps, list):
                      raise ValueError(
                          f"{self.display_name(resolved)} composite steps must be a list"
                      )
                  for step in steps:
                      if isinstance(step, dict) and "uses" in step:
                          self.scan_reference(step["uses"], resolved, "action")

              def scan_all_workflows(self) -> None:
                  workflow_directory = self.repository_root / ".github" / "workflows"
                  workflows = sorted(
                      path
                      for path in workflow_directory.iterdir()
                      if path.is_file() and path.suffix in {".yml", ".yaml"}
                  )
                  if not workflows:
                      raise ValueError("Repository contains no workflow files")
                  for workflow in workflows:
                      self.scan_workflow(workflow)

          repository_scanner = PolicyScanner(Path.cwd())

          for bypass in (
              "- uses : actions/checkout@v4",
              '- "uses": actions/checkout@v4',
              "- { uses: actions/checkout@v4 }",
              r'- "u\u0073es": actions/checkout@v4',
          ):
              try:
                  document = yaml.safe_load(
                      f"jobs:\n  policy:\n    steps:\n      {bypass}\n"
                  )
                  repository_scanner.scan_workflow_document(
                      document, Path("policy-self-test.yml")
                  )
              except ValueError:
                  pass
              else:
                  raise ValueError(f"Workflow policy accepted bypass: {bypass}")

          for reference in (
              f"actions/checkout@{'a' * 40}",
              f"docker://alpine@sha256:{'b' * 64}",
          ):
              repository_scanner.validate_external(
                  reference, Path("policy-self-test.yml")
              )

          fixture_root = Path(os.environ["RUNNER_TEMP"]) / "workflow-policy-fixtures"
          shutil.rmtree(fixture_root, ignore_errors=True)
          fixture_workflows = fixture_root / ".github" / "workflows"
          fixture_action = fixture_root / ".github" / "actions" / "local"
          fixture_workflows.mkdir(parents=True)
          fixture_action.mkdir(parents=True)
          (fixture_workflows / "fixture.yml").write_text(
              """on:\n  workflow_call:\n    inputs:\n      uses:\n        type: string\nenv:\n  uses: not-an-action\njobs:\n  check:\n    runs-on: ubuntu-24.04\n    steps:\n      - uses: ./.github/actions/local\n""",
              encoding="utf-8",
          )
          (fixture_action / "action.yml").write_text(
              """name: hostile-local-action\nruns:\n  using: Composite\n  steps:\n    - uses: actions/checkout@v4\n""",
              encoding="utf-8",
          )
          try:
              PolicyScanner(fixture_root).scan_all_workflows()
          except ValueError:
              pass
          else:
              raise ValueError("Workflow policy accepted an unpinned composite action")

          (fixture_action / "action.yml").write_text(
              f"""name: pinned-local-action\nruns:\n  using: composite\n  steps:\n    - uses: actions/checkout@{'a' * 40}\n""",
              encoding="utf-8",
          )
          PolicyScanner(fixture_root).scan_all_workflows()
          (fixture_action / "action.yml").write_text(
              """name: hostile-docker-action\nruns:\n  using: Docker\n  image: DOCKER://alpine:latest\n""",
              encoding="utf-8",
          )
          decoy_directory = fixture_action / "DOCKER:"
          decoy_directory.mkdir()
          (decoy_directory / "alpine:latest").write_text(
              "not a Dockerfile\n",
              encoding="utf-8",
          )
          try:
              PolicyScanner(fixture_root).scan_all_workflows()
          except ValueError:
              pass
          else:
              raise ValueError("Workflow policy accepted a mutable local Docker action")

          (fixture_action / "action.yml").write_text(
              f"""name: pinned-docker-action\nruns:\n  using: docker\n  image: docker://alpine@sha256:{'b' * 64}\n""",
              encoding="utf-8",
          )
          PolicyScanner(fixture_root).scan_all_workflows()
          (fixture_action / "Dockerfile").write_text(
              "FROM scratch\n",
              encoding="utf-8",
          )
          (fixture_action / "action.yml").write_text(
              """name: local-docker-action\nruns:\n  using: docker\n  image: Dockerfile\n""",
              encoding="utf-8",
          )
          PolicyScanner(fixture_root).scan_all_workflows()
          repository_scanner.scan_all_workflows()
          PYTHON
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const workflowDirectory = path.join('.github', 'workflows');
          const candidate = fs.readFileSync(
            path.join(workflowDirectory, 'candidate.yml'),
            'utf8',
          );
          const required = [
            'tags:',
            'v*',
            'artifact-metadata: write',
            'fetch-depth: 0',
            'git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main',
            'test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"',
            "          printf 'checksums=%s\\n' \"${checksums[0]}\" >> \"${GITHUB_OUTPUT}\"",
            'subject-checksums: ${ { steps.subject.outputs.checksums } }'.replaceAll(' ', ''),
            'gh attestation verify',
            '--digest-alg sha512',
            '--signer-workflow',
            '--signer-digest "${GITHUB_SHA}"',
            '--source-digest "${GITHUB_SHA}"',
            '--source-ref "${GITHUB_REF}"',
            '--deny-self-hosted-runners',
          ];
          const compactCandidate = candidate.replaceAll(' ', '');
          for (const marker of required) {
            const haystack = marker.includes('subject-checksums:')
              ? compactCandidate
              : candidate;
            if (!haystack.includes(marker)) {
              throw new Error(`candidate.yml is missing release policy marker: ${marker}`);
            }
          }
          NODE

  reuse:
    name: REUSE 3.3 compliance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned REUSE tool
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -m venv "${RUNNER_TEMP}/reuse-venv"
          "${RUNNER_TEMP}/reuse-venv/bin/python" -I -m pip install \
            --disable-pip-version-check \
            'reuse[charset-normalizer]==6.2.0'
      - name: Validate licensing metadata
        run: |
          "${RUNNER_TEMP}/reuse-venv/bin/python" -I -m reuse lint

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Verify Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/commits" \
            > "${RUNNER_TEMP}/commits.json"
          node - "${RUNNER_TEMP}/commits.json" <<'NODE'
          const fs = require('node:fs');

          const pages = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const commits = pages.flat();
          if (commits.length === 0) throw new Error('Pull request has no commits.');
          const normalizeName = (value) => value.trim().replace(/\s+/g, ' ');
          for (const entry of commits) {
            const identities = [entry.commit.author, entry.commit.committer]
              .filter(Boolean)
              .map(({ name, email }) => ({
                name: normalizeName(name),
                email: email.trim().toLowerCase(),
              }));
            const trailers = [...entry.commit.message.matchAll(
              /^Signed-off-by:\s*([^<\n]+?)\s*<([^>\n]+)>\s*$/gim,
            )].map((match) => ({
              name: normalizeName(match[1]),
              email: match[2].trim().toLowerCase(),
            }));
            const valid = trailers.some((trailer) =>
              identities.some(
                (identity) =>
                  identity.name === trailer.name &&
                  identity.email === trailer.email,
              ),
            );
            if (!valid) {
              throw new Error(
                `Commit ${entry.sha.slice(0, 12)} lacks an author- or committer-matching Signed-off-by trailer.`,
              );
            }
          }
          NODE
