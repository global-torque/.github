name: Reusable public package CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  required:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.23.1
          - 24.18.0
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run release-grade package checks
        run: pnpm run ci

  informational-node-26:
    name: Node 26 informational
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.5.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run package checks
        run: pnpm run ci

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Verify Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/commits" \
            > "${RUNNER_TEMP}/commits.json"
          jq -e '
            add
            | length > 0 and all(.[].commit.message;
                test("(?im)^Signed-off-by: [^<\\n]+ <[^>\\n]+>$"))
          ' "${RUNNER_TEMP}/commits.json" > /dev/null
